# Melid eşitleme sunucusu — Dokploy (Docker Compose) veya düz `docker compose up -d`
#
# Dokploy: Compose Path = ./server/docker-compose.yml
#   Environment sekmesi (en az): MELID_ADMIN_KEY=<uzun rastgele parola>, MELID_ADMIN_IPS=<ev IP'niz>
#   Domains sekmesi: servis "sync", port 3150, HTTPS açık
# Ayrıntı: docs/senkron.md
services:
  sync:
    build: .
    restart: unless-stopped
    environment:
      # open: herkes hesap açabilir | invite: MELID_SYNC_INVITE davet koduyla | closed: yeni hesap açılamaz
      MELID_REGISTER: ${MELID_REGISTER:-open}
      MELID_SYNC_INVITE: ${MELID_SYNC_INVITE:-}
      MELID_MAX_USERS: ${MELID_MAX_USERS:-1000}
      # Yönetici paneli (/admin): parola + yalnız bu adreslerden (virgülle; CIDR olabilir). Parola boşsa panel kapalı.
      MELID_ADMIN_KEY: ${MELID_ADMIN_KEY:-}
      MELID_ADMIN_IPS: ${MELID_ADMIN_IPS:-}
      # Güncellemeler: imzalı latest.json'ın adresi (GitHub sürümleri) ya da sürüm dosyalarının iç adresi (Forgejo paketleri)
      UPDATE_FEED_URL: ${UPDATE_FEED_URL:-}
      UPDATE_UPSTREAM: ${UPDATE_UPSTREAM:-}
      # Ters vekil arkasında istemci IP'si başlıklardan alınır (deneme sınırı, yönetici IP'si).
      # 1: X-Forwarded-For; cloudflare: Cloudflare'den gelen isteklerde CF-Connecting-IP
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Yerel ağdan doğrudan erişim (uygulamadaki "Yerel ağda ara" bunu bulur). Bu port internete açılmamalı:
    # vekil başlıkları doğrudan gelen isteklerde taklit edilebilir. Yalnız vekil kullanılıyorsa bu iki satırı silin.
    ports:
      - "3150:3150"
    volumes:
      - sshdeck-sync-data:/data
volumes:
  sshdeck-sync-data:

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <title>Melid</title>
  <script>
    // Eski Android System WebView (xterm.js ve modern JS çalışmaz): boş ekran yerine açıklama göster
    (function () {
      var ok = true;
      try { new Function('var a = {}; return a?.b ?? 1'); } catch (e) { ok = false; }
      var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
      if (m && Number(m[1]) < 100) ok = false;
      if (ok) return;
      window.__oldWebView = true;
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML = '<div style="padding:32px 24px;color:#d9dce2;background:#0f1115;font:16px/1.5 sans-serif;position:fixed;top:0;left:0;right:0;bottom:0">'
          + '<h2 style="margin:0 0 12px">WebView güncel değil</h2>'
          + '<p>Melid, telefondaki <b>Android System WebView</b> bileşeninin güncel bir sürümünü gerektirir'
          + (m ? ' (şu an: Chrome ' + m[1] + ', en az 100 gerekir)' : '') + '.</p>'
          + '<p>Play Store\'da <b>Android System WebView</b> (veya Chrome) uygulamasını güncelleyip Melid\'i yeniden açın.</p></div>';
      });
    })();
  </script>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="modals"></div>
  <div id="toasts"></div>
</body>
</html>

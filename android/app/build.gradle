plugins {
    id 'com.android.application'
}

// İmza: CI'da ortam değişkenleri (ANDROID_KEYSTORE_FILE, ..._PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD),
// yerelde keystore.properties. İkisi de yoksa release debug anahtarıyla imzalanır.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def envKs = System.getenv('ANDROID_KEYSTORE_FILE')
if (envKs) {
    ksProps['storeFile'] = envKs
    ksProps['storePassword'] = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    ksProps['keyAlias'] = System.getenv('ANDROID_KEY_ALIAS')
    ksProps['keyPassword'] = System.getenv('ANDROID_KEY_PASSWORD')
}
def hasKs = ksProps['storeFile'] != null

// Sürüm kök package.json'dan: versionCode = MAJOR*10000 + MINOR*100 + PATCH
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def (vMaj, vMin, vPat) = appVersion.tokenize('.-')[0..2].collect { it as int }

android {
    namespace 'dev.sshdeck.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.sshdeck.app'
        minSdk 29
        targetSdk 35
        versionCode vMaj * 10000 + vMin * 100 + vPat
        versionName appVersion
    }

    signingConfigs {
        release {
            if (hasKs) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // JSch algoritma sınıflarını adlarıyla (reflection) yükler; küçültme kapalı
            minifyEnabled false
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    applicationVariants.all { v ->
        v.outputs.all { outputFileName = "SSHDeck-${v.versionName}-${v.buildType.name}.apk" }
    }
}

// xterm.js masaüstü sürümüyle aynı paketten (../node_modules) kopyalanır
def nodeModules = rootProject.file('../node_modules')
tasks.register('copyXterm', Copy) {
    from("$nodeModules/@xterm/xterm/lib/xterm.js")
    from("$nodeModules/@xterm/xterm/css/xterm.css")
    from("$nodeModules/@xterm/addon-fit/lib/addon-fit.js")
    from("$nodeModules/@xterm/addon-search/lib/addon-search.js")
    from("$nodeModules/@xterm/addon-web-links/lib/addon-web-links.js")
    into 'src/main/assets/www/vendor'
}
preBuild.dependsOn copyXterm

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.7'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
}

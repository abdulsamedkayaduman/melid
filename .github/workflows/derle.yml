# Testler + Linux (AppImage, pacman), Windows (kurulum + taşınabilir .exe), macOS (imzasız .tar.gz), Android (imzalı APK).
# Ayrıntılar: docs/ci.md
#
#  - main'e push / pull request: yalnız testler.
#  - Elle başlatma (Actions > derle > Run workflow): testler + dört platform; "yayinla" işaretliyse "gelistirme"
#    ön sürümü (Releases) yenilenir. Uygulamalara güncelleme olarak gitmez.
#  - vX.Y.Z etiketi push'u: aynı derleme + kalıcı "vX.Y.Z" sürümü + imzalı latest.json (uygulama güncellemeleri ve
#    indirme sayfası buna bakar). Etiket package.json sürümüyle aynı olmalı.
name: derle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      yayinla:
        description: 'Releases sayfasında "gelistirme" ön sürümü olarak yayınla'
        type: boolean
        default: true

concurrency:
  group: derle-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Birim testleri (içe aktarma, store, oturum kaydı, güncelleme, eşitleme, bağlantı denetimi)
        run: |
          node test/importers.test.js
          node test/store.test.js
          node test/termlog.test.js
          node test/updater.test.js
          node test/sync.test.js
          node test/conncheck.test.js
          node test/usage.test.js
      - name: Çekirdek testleri (geçici sshd)
        run: |
          sudo ci/test-sshd.sh
          sudo chown -R "$USER" test/.work
          env -u SSH_AUTH_SOCK timeout 600 node test/core.test.js

  linux:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pacman paketi için bsdtar
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools > /dev/null
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --linux AppImage pacman --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: melid-linux
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.pacman

  windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: melid-windows
          retention-days: 14
          path: dist/*.exe

  # Linux'ta üretilir: .zip sembolik bağları bozduğu için .tar.gz; imza ve .dmg için Apple hesabı gerekir (docs/ci.md)
  mac:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Yerel terminal (pty) Mac ikilileri: npm yalnız bu makinenin (Linux) paketini kurar
      - run: npm install --no-save --force --ignore-scripts @lydell/node-pty-darwin-arm64@1.1.0 @lydell/node-pty-darwin-x64@1.1.0
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: melid-mac
          retention-days: 14
          path: dist/*.tar.gz

  android:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # android/app/build.gradle'daki compileSdk ile aynı tutun
      - name: Android SDK paketleri
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # xterm dosyaları ../node_modules'tan kopyalanır
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: android/coretest/.lib
          key: coretest-lib-${{ hashFiles('android/coretest/run.sh') }}
      - name: SSH çekirdeği testleri (JVM, geçici sshd)
        run: |
          command -v sshd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server > /dev/null; }
          sudo install -d -m 755 -o root -g root /run/sshd
          bash android/coretest/run.sh
      - name: İmzalı release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret'ı yok. Telefondaki uygulamanın üzerine kurulabilmesi için APK aynı anahtarla imzalanmalı (docs/ci.md)"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          (cd android && ./gradlew assembleRelease lintRelease)
          rm -f "$ANDROID_KEYSTORE_FILE"
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/Melid-*-release.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$f" | grep -i 'SHA-256'
            cp "$f" "dist/$(basename "$f" -release.apk).apk"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          retention-days: 7
          if-no-files-found: ignore
          path: android/app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: melid-android
          retention-days: 14
          path: dist/*.apk

  yayinla:
    needs: [linux, windows, mac, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.yayinla)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: melid-*
          path: dist
          merge-multiple: true
      - name: GitHub sürümü
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG=$GITHUB_REF_NAME
            [ "$TAG" = "v$VERSION" ] || { echo "::error::Etiket ($TAG) package.json sürümüyle (v$VERSION) aynı değil"; exit 1; }
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            { echo "## Değişiklikler"; echo; git log --format='- %s' ${PREV:+$PREV..}"$TAG"; } > notes.md
            # Uygulamalardaki güncelleme bildirimi ve indirme sayfası latest.json'a bakar.
            # Kullanıcıya görünen notlar: sürüm ve CI commit'leri hariç
            git log --format='- %s' ${PREV:+$PREV..}"$TAG" | grep -Ev '^- (Sürüm [0-9]|CI:)' > update-notes.md || true
            [ -s update-notes.md ] || echo "- Küçük düzeltmeler" > update-notes.md
            if [ -z "$UPDATE_SIGNING_KEY" ]; then
              echo "::error::UPDATE_SIGNING_KEY secret'ı yok: latest.json imzalanamaz (docs/ci.md)"; exit 1
            fi
            node ci/update-feed.js "$VERSION" update-notes.md "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" dist > latest.json
            gh release create "$TAG" dist/* latest.json --title "Melid $TAG" --notes-file notes.md --verify-tag --latest
          else
            {
              echo "\`${GITHUB_REF_NAME}\` dalının ${GITHUB_SHA::7} commit'inden elle başlatılan derleme (çalıştırma #${GITHUB_RUN_NUMBER})."
              echo "Her yeni elle derlemede bu ön sürüm silinip yeniden oluşturulur; uygulamalara güncelleme olarak gitmez."
              echo
              git log -1 --format='%s%n%n%b'
            } > notes.md
            gh release delete gelistirme --cleanup-tag --yes 2>/dev/null || true
            gh release create gelistirme dist/* --title "Melid $VERSION (geliştirme, ${GITHUB_SHA::7})" \
              --notes-file notes.md --prerelease --latest=false --target "$GITHUB_SHA"
          fi

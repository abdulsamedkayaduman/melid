# GEÇİCİ: bir job'un çıktısını "ci-gunluk" ön sürümüne dosya olarak koyar (API log vermiyor). Sorun çözülünce silinecek.
on:
  workflow_dispatch:
    inputs:
      is:
        description: 'test | linux'
        default: linux
jobs:
  gunluk:
    runs-on: docker
    container: node:22-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: |
          set +e
          {
            id; umask; df -h / /tmp | tail -2
            if [ "${{ github.event.inputs.is }}" = linux ]; then
              apt-get update -qq && apt-get install -y -qq libarchive-tools > /dev/null; echo "apt=$?"
              npm ci --no-audit --no-fund; echo "npm=$?"
              npx electron-builder --linux AppImage pacman --publish never; echo "builder=$?"
              ls -la dist
            else
              ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund
              bash -x ci/test-sshd.sh; echo "sshd=$?"
              env -u SSH_AUTH_SOCK timeout 300 node test/core.test.js; echo "core=$?"
            fi
          } > ci-gunluk.txt 2>&1
          echo ok > notes.md
          FORGEJO_TOKEN=${{ secrets.GITHUB_TOKEN }} ROLLING=1 ci/forgejo-release.sh ci-gunluk "CI günlüğü (geçici)" notes.md true ci-gunluk.txt

# GEÇİCİ: artifact action'larının Forgejo'da hangisinin çalıştığını dener. Sorun çözülünce silinecek.
on: workflow_dispatch
jobs:
  gh-v4:
    runs-on: docker
    container: node:22-bookworm
    steps:
      - run: mkdir d && echo a > d/a.txt
      - uses: https://data.forgejo.org/actions/upload-artifact@v4
        with: { name: deneme-gh, path: d/a.txt, retention-days: 1 }
  fj-v4:
    runs-on: docker
    container: node:22-bookworm
    steps:
      - run: mkdir d && echo b > d/b.txt
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with: { name: deneme-fj, path: d/b.txt, retention-days: 1 }
  fj-indir:
    needs: fj-v4
    runs-on: docker
    container: node:22-bookworm
    steps:
      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with: { pattern: deneme-*, path: out, merge-multiple: true }
      - run: ls -R out && test -f out/b.txt
